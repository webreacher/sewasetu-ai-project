services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-sewasetu-admin-2026}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    expose:
      - "8025"

  citizen-mcp:
    build:
      context: ./mcp_servers
      dockerfile: Dockerfile
    command: ["python", "citizen_mcp.py"]
    ports:
      - "8100:8100"
    environment:
      PORTAL_URL: http://app:8000
      CITIZEN_MCP_URL: http://localhost:8100
    depends_on:
      - app

  officer-mcp:
    build:
      context: ./mcp_servers
      dockerfile: Dockerfile
    command: ["python", "officer_mcp.py"]
    ports:
      - "8200:8200"
    environment:
      PORTAL_URL: http://app:8000
      OFFICER_MCP_URL: http://localhost:8200
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  applogs: